[build-system]
requires = ["setuptools>=68,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "xsa-fineweb-repro"
version = "0.1.0"
description = "Controlled small-scale Exclusive Self Attention reproduction"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5,<2.10", "numpy>=1.26,<3", "PyYAML>=6,<7",
  "datasets>=3,<5", "huggingface-hub>=0.27,<2", "tiktoken>=0.8,<1",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["xsa_repro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
